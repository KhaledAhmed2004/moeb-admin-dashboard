name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual "Run workflow" button in the Actions tab

# Never run two deploys at the same time; queue them instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest
    env:
      # Real value comes from the server's .env at deploy time; this only lets the check build.
      NEXT_PUBLIC_API_URL: https://api.ekkali.app/api/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20' # same major version as the production server
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run build

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SSH into server and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -e
            cd /root/projects/moeb-dashboard-v2
            PREV=$(git rev-parse HEAD)
            git fetch origin main
            git reset --hard origin/main
            bash scripts/deploy.sh "$PREV"
